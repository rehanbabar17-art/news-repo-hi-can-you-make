name: Half-Hourly Pakistan News

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore seen-state
        uses: actions/cache/restore@v4
        with:
          path: seen_articles.json
          key: seen-state-${{ github.run_number }}
          restore-keys: seen-state-
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news & send to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: |
          # Outer hard watchdog: even if the python process itself freezes
          # (uninterruptible sleep), a separate `timeout` process kills it.
          rc=0
          timeout --kill-after=5 210 python scripts/fetch_news.py || rc=$?
          echo "fetch script exit code: $rc"
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "⚠ Run exceeded 210s watchdog — worker frozen/killed. Next cron run continues normally."
            exit 0
          fi
          exit "$rc"

      - name: Save seen-state
        uses: actions/cache/save@v4
        with:
          path: seen_articles.json
          key: seen-state-${{ github.run_number }}
        if: always()
