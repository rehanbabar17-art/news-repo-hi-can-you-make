name: Half-Hourly Pakistan News

on:
  schedule:
    # Run every 30 minutes (UTC)
    - cron: '0,30 * * * *'
  workflow_dispatch:          # allow manual trigger from Actions tab

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore seen-articles state
        uses: actions/download-artifact@v4
        with:
          name: seen-state
          path: .
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news & send to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/fetch_news.py

      # Persist state across runs so we don't re-send the same articles
      - name: Save seen-articles state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seen-state
          path: .seen_articles.json
          retention-days: 90
          overwrite: true
