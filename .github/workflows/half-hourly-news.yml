name: Half-Hourly Pakistan News

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore seen-state
        uses: actions/cache/restore@v4
        with:
          path: seen_articles.json
          key: seen-state-${{ github.run_number }}
          restore-keys: seen-state-
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news & send to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: python scripts/fetch_news.py

      - name: Save seen-state
        uses: actions/cache/save@v4
        with:
          path: seen_articles.json
          key: seen-state-${{ github.run_number }}
        if: always()
